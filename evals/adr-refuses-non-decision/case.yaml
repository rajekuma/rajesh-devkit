schema_version: "1.1"
name: adr-refuses-non-decision
description: >
  A variable rename is not an architecture decision. devkit-adr must decline
  to write a record, say where the note belongs instead, and create no file.
tags: [component, adr]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
  prompt: |
    Write an ADR for renaming the local variable `t` to `task` inside
    src/tasks.js's add() function, for readability.
