schema_version: "1.1"
name: implementer-red-green
description: >
  devkit-implementer must derive and cache the test runner, run the suite
  more than once (RED then GREEN), tick the criteria in the spec, and report
  RED/GREEN per criterion - without inventing a runner or modifying tests
  to pass.
tags: [component, implementer]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Agent]
  prompt: |
    Use the devkit-implementer subagent to implement specs/task-priority.md
    in full. When it reports back, relay its report verbatim, including the
    performance snapshot.
