schema_version: "1.1"
name: escalation-gate-integration
description: >
  End to end through the real hooks: PROGRESS.md queues a milestone whose
  spec carries SENSITIVE: markers. Asked to continue, the session must stop
  and ask the user whether to implement directly or delegate - and must never
  auto-delegate to devkit-implementer.
tags: [integration, hooks, escalation]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill, AskUserQuestion]
  prompt: |
    Continue with the next milestone in PROGRESS.md.
