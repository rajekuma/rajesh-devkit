schema_version: "1.1"
name: ship-blocks-unaccounted
description: >
  An unticked acceptance criterion with no row in PROGRESS.md's Tracked
  follow-ups table is an
  unaccounted criterion. devkit-ship must return blocked and name it.
tags: [component, ship]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Bash, Agent]
  prompt: |
    Milestone 1 (specs/task-completion.md) is committed and the reviewer has
    signed off. Use the devkit-ship subagent to run the pre-ship preflight
    and relay its gate table and verdict line verbatim.
