schema_version: "1.1"
name: help-no-progress
description: >
  With no PROGRESS.md, devkit-help must run the real session-welcome check
  and walk through the bootstrap sequence conversationally rather than
  dumping the raw checklist.
tags: [component, help]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    How do I use this plugin? What should I do next in this project?
