schema_version: "1.1"
name: security-finds-ownership-gap
description: >
  devkit-security must find a broken object-level authorization gap that the
  project's own ADR forbids - a function that fetches by id without checking
  the caller owns the row - cite the file and function, return blocked, and
  write nothing. The invariant is in the repo, not the prompt: the point is
  that it reads the project's stated rules before hunting.
tags: [component, security]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Bash, Agent]
  prompt: |
    Use the devkit-security subagent to review the current uncommitted change
    in this repo for code-level vulnerabilities. Run it in the foreground
    (run_in_background: false) and relay its full report, including every
    finding and the verdict line, verbatim.
