schema_version: "1.1"
name: reviewer-catches-unmet
description: >
  devkit-reviewer must return needs-changes when a criterion is ticked but
  also has a row in PROGRESS.md's Tracked follow-ups table, and must name the Deferred state - while writing
  nothing.
tags: [component, reviewer]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Agent]
  prompt: |
    Use the devkit-reviewer subagent to review the current uncommitted change
    in this repo against its spec. Relay its full report, including the
    verdict line, verbatim.
